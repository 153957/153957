name: Run tests

on:
  schedule:
    - cron: '0 6 1,15 * 5'
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv tool install 'rust-just==1.58.0'
      - run: just build
      - uses: Cyb3r-Jak3/html5validator-action@v8.0.0
        with:
          root: .build/
          log_level: INFO
          blacklist: index_footer.html index_header.html

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv tool install 'rust-just==1.58.0'
      - run: just test
        env:
          RUFF_FORMAT: github
